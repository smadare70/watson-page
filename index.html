<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ווטסון</title>
<meta name="description" content="ווטסון: הסוכן הבלש עם זכוכית המגדלת, העוזר האישי שנבנה בעולם סוכני ה-AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="modulepreload" href="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
<link rel="preload" href="assets/poster.webp" as="image">
<link rel="preload" href="assets/agent-compressed-fixed.glb" as="fetch" crossorigin>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    --primary: #4A6A8A;
    --secondary: #7EC8F0;
    --accent: #F28C28;
    --bg: #EAF6FD;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Fredoka", system-ui, sans-serif;
    background: var(--bg);
    color: var(--primary);
    line-height: 1.6;
  }

  /* Hero: רקע תכלת מונפש (בהשראת Floating Gradient של 21st.dev) */
  .hero {
    position: relative;
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px 32px;
    text-align: center;
    background: linear-gradient(180deg, var(--secondary) 0%, var(--bg) 100%);
  }
  .blob {
    position: absolute;
    width: 28rem;
    height: 28rem;
    border-radius: 50%;
    filter: blur(64px);
    opacity: .55;
    pointer-events: none;
  }
  .blob.b1 { top: 5%;  right: 8%;  background: linear-gradient(90deg, var(--secondary), #fff); animation: drift1 9s ease-in-out infinite; }
  .blob.b2 { bottom: 5%; left: 6%; background: linear-gradient(90deg, var(--primary), var(--secondary)); opacity: .35; animation: drift2 11s ease-in-out infinite; }
  .blob.b3 { top: 45%; left: 40%;  background: linear-gradient(90deg, #fff, var(--secondary)); animation: drift3 13s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); }   50% { transform: translate(-100px,50px) scale(1.2); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); }   50% { transform: translate(100px,-50px) scale(1.3); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); }   50% { transform: translate(-50px,-100px) scale(1.1); } }

  .hero > *:not(.blob) { position: relative; z-index: 1; }

  h1 {
    margin: 0;
    font-size: clamp(52px, 13vw, 120px);
    font-weight: 700;
    line-height: 1.1;
  }
  /* אותיות עם נפח: שכבות הבלטה כהות, ברק עליון וצל רך מתחת */
  .ch {
    display: inline-block;
    cursor: default;
    transform-origin: 50% 100%;
    text-shadow:
      0 1px 0 #3a5673, 0 2px 0 #3a5673, 0 3px 0 #3a5673, 0 4px 0 #3a5673,
      0 5px 0 #34506b, 0 6px 0 #34506b, 0 7px 0 #2f4962, 0 8px 0 #2f4962,
      0 10px 6px rgba(47,73,98,.35), 0 16px 18px rgba(47,73,98,.25);
    -webkit-text-stroke: 2px #3a5673;
    paint-order: stroke fill;
  }
  .ch.c0 { color: #ffffff; }
  .ch.c1 { color: var(--accent); }
  .ch.c2 { color: #ffd479; }
  .ch .in { display: inline-block; transform-origin: 50% 100%; }
  /* גל קטן ושמח: כל אות קופצת מעט אחרי הקודמת, ואז הפסקה קצרה לפני הגל הבא */
  .ch { animation: letterWave 3.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.09s); }
  @keyframes letterWave {
    0%, 22%, 100% { transform: translateY(0) rotate(0) scale(1,1); }
    5%  { transform: translateY(1px) rotate(0) scale(1.05,.95); }
    11% { transform: translateY(-9px) rotate(-3deg) scale(.97,1.05); }
    17% { transform: translateY(0) rotate(1deg) scale(1.04,.96); }
  }
  .ch .in.hop { animation: letterHop .6s cubic-bezier(.3,.7,.4,1); }
  @keyframes letterHop {
    0%   { transform: translateY(0) scale(1,1); }
    18%  { transform: translateY(2px) scale(1.12,.84); }
    45%  { transform: translateY(-30px) rotate(-6deg) scale(.92,1.14); }
    72%  { transform: translateY(0) rotate(3deg) scale(1.1,.88); }
    86%  { transform: translateY(-5px) rotate(-1deg) scale(.98,1.03); }
    100% { transform: translateY(0) rotate(0) scale(1,1); }
  }
  .tagline {
    margin: 16px 0 0;
    max-width: 560px;
    text-wrap: balance;
    font-size: clamp(18px, 2.6vw, 26px);
    line-height: 1.4;
    font-weight: 500;
    color: var(--primary);
  }

  /* הדמות לא מגיבה לעכבר או לאצבע, והאצבע ממשיכה לגלול את הדף */
  #hero-model { pointer-events: none; touch-action: pan-y; }
  model-viewer {
    width: min(92vw, 460px);
    height: min(50vh, 420px);
    --poster-color: transparent;
    --progress-bar-height: 0px;
    --progress-bar-color: transparent;
    background: transparent;
  }
  .stage { margin-top: 8px; }

  .pill {
    display: inline-block;
    padding: 12px 32px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 6px 0 #c46d14, 0 12px 24px rgba(242,140,40,.35);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .pill:hover:not(:disabled), .pill:focus-visible { transform: translateY(-3px); box-shadow: 0 9px 0 #c46d14, 0 16px 28px rgba(242,140,40,.4); }
  .pill:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 3px 0 #c46d14; }
  .pill-alt { background: #fff; color: var(--primary); box-shadow: 0 6px 0 #b9d3e6, 0 12px 24px rgba(74,106,138,.2); }
  .pill-alt:hover:not(:disabled), .pill-alt:focus-visible { box-shadow: 0 9px 0 #b9d3e6, 0 16px 28px rgba(74,106,138,.25); }
  .pill-alt:active:not(:disabled) { box-shadow: 0 3px 0 #b9d3e6; }
  .pill:disabled { opacity: .55; cursor: default; }

  /* סקר: אהבתי / לא אהבתי */
  .poll { margin-top: 20px; }
  .poll p { margin: 0 0 14px; font-size: 20px; font-weight: 600; }
  .poll .buttons { display: flex; flex-wrap: wrap; gap: 16px 20px; justify-content: center; }
  .poll .thanks { margin: 14px 0 0; min-height: 1.6em; font-size: 18px; font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .blob, .pill, .ch, .ch .in { animation: none !important; transition: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <h1 aria-label="ווטסון" id="title"><span class="ch c0" style="--i:0" aria-hidden="true"><span class="in">ו</span></span><span class="ch c1" style="--i:1" aria-hidden="true"><span class="in">ו</span></span><span class="ch c2" style="--i:2" aria-hidden="true"><span class="in">ט</span></span><span class="ch c0" style="--i:3" aria-hidden="true"><span class="in">ס</span></span><span class="ch c1" style="--i:4" aria-hidden="true"><span class="in">ו</span></span><span class="ch c2" style="--i:5" aria-hidden="true"><span class="in">ן</span></span></h1>
  <h2 class="tagline">העוזר האישי בעולם סוכני ה-AI: בלש חד וסקרן, עם זכוכית מגדלת שלא מפספסת אף פרט.</h2>

  <div class="stage" id="stage">
    <model-viewer id="hero-model"
      src="assets/agent-compressed-fixed.glb"
      alt="ווטסון, הסוכן הבלש עם זכוכית המגדלת"
      poster="assets/poster.webp"
      loading="eager"
      reveal="auto"
      interaction-prompt="none"
      shadow-intensity="0.8"
      exposure="1.1">
    </model-viewer>
  </div>

  <div class="poll" id="poll">
    <p>מה דעתך על ווטסון?</p>
    <div class="buttons">
      <button class="pill" type="button" data-vote="like">אהבתי</button>
      <button class="pill pill-alt" type="button" data-vote="dislike">לא אהבתי</button>
    </div>
    <p class="thanks" id="thanks" role="status" aria-live="polite"></p>
  </div>
</header>

<script>
  /* הדמות עומדת במקום. בכל פעם שעוברים עליה (עכבר או אצבע) היא עושה סיבוב מהיר של 360 מעלות ונעצרת.
     אין גרירה ואין זום: האצבע ממשיכה לגלול את הדף. */
  (function () {
    var stage = document.getElementById('stage');
    var mv = document.getElementById('hero-model');
    var scene, body = null, spinning = false, SPIN_MS = 700;

    function init() {
      var sym = Object.getOwnPropertySymbols(mv).filter(function (s) { return s.description === 'scene'; })[0];
      scene = mv[sym];
      scene.traverse(function (o) {
        if (!body && o.type === 'Group' && o.children.some(function (c) { return c.type === 'Group'; })) body = o;
        var m = o.isMesh && o.material;
        if (m && m.name === 'lens-glass') { m.opacity = 0.03; m.transparent = true; m.depthWrite = false; m.envMapIntensity = 0; m.needsUpdate = true; }
      });
      scene.queueRender();
    }
    function spin() {
      if (!body || spinning) return;
      spinning = true;
      var t0 = performance.now();
      (function step(now) {
        var t = Math.min((now - t0) / SPIN_MS, 1);
        var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        body.rotation.y = Math.PI * 2 * e;
        scene.queueRender();
        if (t < 1) requestAnimationFrame(step);
        else { body.rotation.y = 0; scene.queueRender(); spinning = false; }
      })(t0);
    }
    if (mv.loaded) init(); else mv.addEventListener('load', init);
    stage.addEventListener('pointerenter', spin);
    stage.addEventListener('pointerdown', spin);
  })();
</script>
<script>
  /* בנוסף לגל האוטומטי: כל אות קופצת גבוה יותר כשעוברים עליה עם העכבר (או נוגעים בה) */
  document.querySelectorAll('#title .ch').forEach(function (ch) {
    var el = ch.querySelector('.in');
    function hop() {
      if (el.classList.contains('hop')) return;
      el.classList.add('hop');
      setTimeout(function () { el.classList.remove('hop'); }, 620);
    }
    ch.addEventListener('pointerenter', hop);
    ch.addEventListener('click', hop);
  });
</script>
<script>
  /* סקר "אהבתי / לא אהבתי": כל הצבעה מוסיפה 1 למונה חינמי (abacus.jasoncameron.dev).
     לא נשמר שום פרט אישי. הצבעה אחת לדפדפן (נשמרת ב-localStorage, ואפשר לעקוף אותה, זה סקר לא רשמי).
     כדי לראות את התוצאות פותחים בדפדפן:
     https://abacus.jasoncameron.dev/get/smadare70-watson-page/like  וגם  .../dislike */
  (function () {
    var NS = 'smadare70-watson-page', STORE = 'watson-voted';
    var thanks = document.getElementById('thanks');
    var buttons = document.querySelectorAll('#poll [data-vote]');

    function lock() { buttons.forEach(function (b) { b.disabled = true; }); }
    var voted = null;
    try { voted = localStorage.getItem(STORE); } catch (e) {}
    if (voted) { lock(); thanks.textContent = 'כבר הצבעת. תודה!'; }

    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var kind = btn.getAttribute('data-vote');
        lock();
        thanks.textContent = kind === 'like' ? 'תודה! שמחים שאהבת.' : 'תודה על הכנות!';
        try { localStorage.setItem(STORE, kind); } catch (e) {}
        fetch('https://abacus.jasoncameron.dev/hit/' + NS + '/' + kind).catch(function () {});
      });
    });
  })();
</script>

</body>
</html>
